<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodify | Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Create Account</h1>
            <p>Join Melodify to sync your library across devices</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/signup">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com" value="{{ email | default('') }}" class="{% if error_fields and 'email' in error_fields %}error-outline{% endif %}">
            </div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Display Name" value="{{ username | default('') }}" class="{% if error_fields and 'username' in error_fields %}error-outline{% endif %}">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="" class="{% if error_fields and 'password' in error_fields %}error-outline{% endif %}">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="" class="{% if error_fields and 'confirm_password' in error_fields %}error-outline{% endif %}">
            </div>
            
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>

        <div class="divider">or</div>

        <a href="{{ url_for('login') }}" style="text-decoration: none;">
            <button class="btn btn-secondary">Already have an account? Log In</button>
        </a>
    </div>
    
    <div style="text-align: center; margin-top: 20px; font-size: 0.8rem; color: #9ca3af;">
        <a href="{{ url_for('privacy_policy') }}" style="color: #9ca3af; text-decoration: underline;">Privacy Policy</a> | 
        <a href="{{ url_for('terms_of_service') }}" style="color: #9ca3af; text-decoration: underline;">Terms of Service</a>
    </div>
</body>
</html>
