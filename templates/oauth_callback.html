<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodify | OAuth Callback</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Authenticating...</h1>
            <p>Please wait while we redirect you.</p>
        </div>
        
        <script>
            // Parse the access token from the URL hash provided by Supabase
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                
                if (accessToken) {
                    window.location.href = `melodify://auth?sessionCode=${accessToken}`;
                } else {
                    document.querySelector('.header p').innerText = "Authentication failed. Redirecting to login...";
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                }
            } else {
                document.querySelector('.header p').innerText = "No session found. Redirecting to login...";
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            }
        </script>
    </div>
</body>
</html>
